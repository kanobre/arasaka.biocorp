<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>admin · f4rmacia.01</title>
<style>
  :root{
    --bg:#0b0d10; --bg-soft:#14171b; --line:#23272d; --ink:#eef1f3; --muted:#8a939c; --accent:#baff29; --red:#e07a7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding:24px; }
  .wrap{ max-width:480px; margin:0 auto; }
  h1{ font-size:20px; margin-bottom:4px; }
  .muted{ color:var(--muted); font-size:13px; margin-bottom:24px; }
  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=password], input[type=number], select{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px; font-size:14px; margin-bottom:12px;
  }
  input[type=color]{ width:56px; height:36px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--bg); margin-bottom:12px; }
  button{ cursor:pointer; border:none; border-radius:8px; font-weight:700; font-size:13px; padding:10px 14px; transition:transform .1s ease; }
  button:active{ transform:scale(0.97); }
  .btn-accent{ background:var(--accent); color:#0b0d10; width:100%; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); width:100%; }
  .btn-ghost.small{ width:100%; padding:7px 10px; font-size:11px; }
  .icon-btn{ background:transparent; border:1px solid var(--line); color:var(--muted); width:26px; height:26px; border-radius:6px; font-size:12px; }
  #login{ max-width:320px; margin:80px auto; text-align:center; }
  #dashboard{ display:none; }
  .note{ font-size:11px; color:var(--muted); line-height:1.5; margin-top:8px; }
  .section-title{ font-size:13px; font-weight:700; margin-bottom:12px; }
  .card{ background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .admin-product-card{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .admin-product-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .admin-product-index{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .photo-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .photo-preview{ width:56px; height:56px; border-radius:8px; object-fit:cover; background:var(--bg-soft); border:1px solid var(--line); flex-shrink:0; }
  .photo-preview.empty{ display:flex; align-items:center; justify-content:center; font-size:22px; opacity:.35; }
  .photo-btns{ display:flex; flex-direction:column; gap:6px; flex:1; }
  .stock-row{ display:flex; align-items:flex-end; gap:8px; }
  .stock-row > div{ flex:1; }
  .stock-minus{ width:36px; height:38px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-weight:700; margin-bottom:12px; }
</style>
</head>
<body>

<div id="login">
  <h1>acesso restrito</h1>
  <p class="muted">painel do administrador — f4rmacia.01</p>
  <input type="text" id="userInput" placeholder="usuário" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter') tryLogin()">
  <input type="password" id="pwInput" placeholder="senha" onkeydown="if(event.key==='Enter') tryLogin()">
  <button class="btn-accent" onclick="tryLogin()">entrar</button>
  <p class="note" id="loginError" style="color:var(--red);"></p>

  <button class="btn-ghost" style="margin-top:10px;" onclick="toggleRecovery()">esqueci minha senha</button>

  <div id="recoveryBox" style="display:none; text-align:left; margin-top:12px;">
    <label>código de confirmação</label>
    <input type="text" id="recoveryCode" placeholder="código" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="btn-ghost" onclick="checkRecoveryCode()">confirmar código</button>
    <p class="note" id="recoveryError" style="color:var(--red);"></p>

    <div id="newPasswordBox" style="display:none; margin-top:12px;">
      <label>nova senha</label>
      <input type="password" id="newPassword" placeholder="nova senha" onkeydown="if(event.key==='Enter') setNewPassword()">
      <button class="btn-accent" onclick="setNewPassword()">salvar nova senha</button>
      <p class="note" id="newPasswordMsg"></p>
    </div>
  </div>
</div>

<div id="dashboard" class="wrap">
  <h1>painel · f4rmacia.01</h1>
  <p class="muted">privado — não compartilhe este link</p>
  <p class="note" id="loadStatus"></p>

  <div class="card">
    <div class="section-title">conta</div>
    <label>usuário do instagram (sem @)</label>
    <input type="text" id="igHandleInput" onchange="editAccount('instagram', this.value)">
    <label>número do whatsapp (só números, com país e ddd)</label>
    <input type="text" id="whatsappInput" placeholder="ex: 5511999999999" onchange="editAccount('whatsapp', this.value)">
    <label>chave pix</label>
    <input type="text" id="pixKeyInput" onchange="editAccount('pix', this.value)">
    <label>texto abaixo do nome</label>
    <input type="text" id="subtitleInput" onchange="editAccount('subtitle', this.value)">
  </div>

  <div class="card">
    <div class="section-title">aparência</div>
    <label>cor do tema</label>
    <input type="color" id="themeColorInput" onchange="editAccount('theme', this.value)">
  </div>

  <div class="card">
    <div class="section-title">produtos</div>
    <div id="productList"></div>
    <button class="btn-ghost" onclick="addProduct()">+ adicionar produto</button>
  </div>

  <div class="card">
    <button class="btn-accent" onclick="saveToCloud()">salvar</button>
    <p class="note" id="saveStatus">assim que salvar, o cartão público já mostra os dados novos (na próxima vez que alguém abrir a página).</p>
  </div>
</div>

<script>
  const ADMIN_USER = "Bk_Rlk.01";
  const ADMIN_PASSWORD = "Arasak@1";
  const RECOVERY_CODE = "280506";

  function getCurrentUser(){
    return localStorage.getItem('f4rmacia_admin_user_override') || ADMIN_USER;
  }
  function getCurrentPassword(){
    return localStorage.getItem('f4rmacia_admin_password_override') || ADMIN_PASSWORD;
  }

  function toggleRecovery(){
    const box = document.getElementById('recoveryBox');
    box.style.display = (box.style.display === 'none') ? 'block' : 'none';
  }
  function checkRecoveryCode(){
    const code = document.getElementById('recoveryCode').value;
    if(code === RECOVERY_CODE){
      document.getElementById('newPasswordBox').style.display = 'block';
      document.getElementById('recoveryError').textContent = '';
    } else {
      document.getElementById('recoveryError').textContent = 'código incorreto';
    }
  }
  function setNewPassword(){
    const newPw = document.getElementById('newPassword').value;
    if(!newPw) return;
    localStorage.setItem('f4rmacia_admin_password_override', newPw);
    document.getElementById('newPasswordMsg').style.color = 'var(--accent)';
    document.getElementById('newPasswordMsg').textContent = 'senha trocada! já pode entrar com ela.';
  }

  function tryLogin(){
    const user = document.getElementById('userInput').value;
    const val = document.getElementById('pwInput').value;
    if(user === getCurrentUser() && val === getCurrentPassword()){
      document.getElementById('login').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      initDashboard();
    } else {
      document.getElementById('loginError').textContent = 'usuário ou senha incorretos';
    }
  }

  // ===== NUVEM (JSONBin) =====
  const JSONBIN_WRITE_KEY = "COLE_AQUI_SUA_CHAVE_DE_ESCRITA";
  let BIN_ID = "COLE_AQUI_O_ID_DO_BIN";

  let account = {
    instagram: "seu_usuario_aqui",
    whatsapp: "5500000000000",
    pix: "5ac3afe2-e496-4311-ae61-dd4bf6171533",
    subtitle: "escolhe aí o que você veio ver",
    theme: "#baff29"
  };
  let products = [];

  function editAccount(field, value){
    account[field] = value;
  }
  function renderAccount(){
    document.getElementById('igHandleInput').value = account.instagram || '';
    document.getElementById('whatsappInput').value = account.whatsapp || '';
    document.getElementById('pixKeyInput').value = account.pix || '';
    document.getElementById('subtitleInput').value = account.subtitle || '';
    document.getElementById('themeColorInput').value = account.theme || '#baff29';
  }

  function defaultProducts(){
    return [
      { name:"Nome 1",  price:1,  stock:10, photo:"" },
      { name:"Nome 2",  price:2,  stock:10, photo:"" },
      { name:"Nome 3",  price:3,  stock:0,  photo:"" },
      { name:"Nome 4",  price:4,  stock:10, photo:"" },
      { name:"Nome 5",  price:5,  stock:10, photo:"" },
      { name:"Nome 6",  price:6,  stock:10, photo:"" },
      { name:"Nome 7",  price:7,  stock:10, photo:"" },
      { name:"Nome 8",  price:8,  stock:10, photo:"" },
      { name:"Nome 9",  price:9,  stock:10, photo:"" },
      { name:"Nome 10", price:10, stock:10, photo:"" },
    ];
  }

  async function loadCloudData(){
    const statusEl = document.getElementById('loadStatus');
    if(!BIN_ID || BIN_ID.indexOf('COLE_') === 0){
      products = defaultProducts();
      statusEl.textContent = 'nenhum dado salvo na nuvem ainda — edite abaixo e toque em salvar pra criar.';
      renderAccount();
      renderProductList();
      return;
    }
    try{
      const res = await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID + '/latest', {
        headers: { 'X-Master-Key': JSONBIN_WRITE_KEY }
      });
      if(!res.ok) throw new Error('resposta ' + res.status);
      const json = await res.json();
      const data = json.record || {};
      account = {
        instagram: data.instagram || account.instagram,
        whatsapp: data.whatsapp || account.whatsapp,
        pix: data.pix || account.pix,
        subtitle: data.subtitle || account.subtitle,
        theme: data.theme || account.theme
      };
      products = data.products || defaultProducts();
      statusEl.textContent = 'dados carregados da nuvem.';
    } catch(e){
      statusEl.textContent = 'não consegui carregar da nuvem — confira sua chave e o bin id.';
      console.error(e);
    }
    renderAccount();
    renderProductList();
  }

  async function saveToCloud(){
    const statusEl = document.getElementById('saveStatus');
    const payload = Object.assign({}, account, { products: products });
    statusEl.textContent = 'salvando...';
    try{
      if(!BIN_ID || BIN_ID.indexOf('COLE_') === 0){
        const res = await fetch('https://api.jsonbin.io/v3/b', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_WRITE_KEY,
            'X-Bin-Name': 'cartao-f4rmacia'
          },
          body: JSON.stringify(payload)
        });
        if(!res.ok) throw new Error('resposta ' + res.status);
        const json = await res.json();
        BIN_ID = json.metadata.id;
        statusEl.innerHTML = 'salvo! copie este código: <b>' + BIN_ID + '</b><br>cole esse valor no lugar de BIN_ID nos dois arquivos (aqui e no cartao-f4rmacia.html), depois suba os dois de novo.';
      } else {
        const res = await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_WRITE_KEY
          },
          body: JSON.stringify(payload)
        });
        if(!res.ok) throw new Error('resposta ' + res.status);
        statusEl.textContent = 'salvo! o cartão público já mostra os dados novos na próxima vez que alguém abrir a página.';
      }
    } catch(e){
      statusEl.textContent = 'não consegui salvar — confira sua chave e o bin id.';
      console.error(e);
    }
  }

  function renderProductList(){
    const wrap = document.getElementById('productList');
    wrap.innerHTML = products.map((p,i) => `
      <div class="admin-product-card">
        <div class="admin-product-head">
          <span class="admin-product-index">produto ${i+1}</span>
          <button class="icon-btn" onclick="removeProduct(${i})">×</button>
        </div>
        <label>nome</label>
        <input type="text" value="${p.name}" data-i="${i}" data-field="name" onchange="editProduct(this)">
        <label>preço (R$)</label>
        <input type="number" value="${p.price}" data-i="${i}" data-field="price" onchange="editProduct(this)">
        <label>estoque (0 = esgotado)</label>
        <div class="stock-row">
          <div>
            <input type="number" value="${p.stock}" data-i="${i}" data-field="stock" onchange="editProduct(this)" style="margin-bottom:0;">
          </div>
          <button type="button" class="stock-minus" title="baixar 1 do estoque (pedido entregue)" onclick="decrementStock(${i})">−1</button>
        </div>
        <label>foto</label>
        <div class="photo-row">
          ${p.photo
            ? `<img src="${p.photo}" class="photo-preview">`
            : `<div class="photo-preview empty">🖼️</div>`}
          <div class="photo-btns">
            <button type="button" class="btn-ghost small" onclick="document.getElementById('camera-${i}').click()">📷 câmera</button>
            <button type="button" class="btn-ghost small" onclick="document.getElementById('gallery-${i}').click()">🖼️ galeria</button>
          </div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="camera-${i}" style="display:none" onchange="handlePhotoFile(this, ${i})">
        <input type="file" accept="image/*" id="gallery-${i}" style="display:none" onchange="handlePhotoFile(this, ${i})">
        ${p.photo ? `<button type="button" class="btn-ghost small" onclick="clearPhoto(${i})">remover foto</button>` : ''}
      </div>
    `).join('');
  }

  function editProduct(el){
    const i = el.dataset.i, field = el.dataset.field;
    if(field === 'price') products[i][field] = parseFloat(el.value) || 0;
    else if(field === 'stock') products[i][field] = parseInt(el.value) || 0;
    else products[i][field] = el.value;
  }

  function decrementStock(i){
    products[i].stock = Math.max(0, (products[i].stock || 0) - 1);
    renderProductList();
  }

  function handlePhotoFile(input, i){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxSize = 300;
        let w = img.width, h = img.height;
        if(w > h && w > maxSize){ h = h*(maxSize/w); w = maxSize; }
        else if(h > maxSize){ w = w*(maxSize/h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        products[i].photo = canvas.toDataURL('image/jpeg', 0.7);
        renderProductList();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearPhoto(i){
    products[i].photo = '';
    renderProductList();
  }

  function addProduct(){
    products.push({ name:"Novo produto", price:0, stock:0, photo:"" });
    renderProductList();
  }
  function removeProduct(i){
    if(confirm('remover este produto da lista?')){
      products.splice(i,1);
      renderProductList();
    }
  }

  function initDashboard(){
    loadCloudData();
  }
</script>

</body>
</html>
