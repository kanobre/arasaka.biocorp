<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@f4rmacia.01</title>
<style>
  :root{
    --bg: #0b0d10;
    --bg-soft: #14171b;
    --line: #23272d;
    --ink: #eef1f3;
    --muted: #8a939c;
    --accent: #baff29;
    --accent-dim: #2c331a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ width:100%; max-width:400px; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .top-row .tap{ margin-bottom:0; }
  .menu-dots{ color:var(--muted); text-decoration:none; font-size:20px; padding:6px 12px; line-height:1; border-radius:8px; transition:background .15s ease, color .15s ease; }
  .menu-dots:active{ background:var(--bg-soft); color:var(--ink); }
  .tap{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:28px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 rgba(186,255,41,.6); animation:pulse 1.8s infinite; flex-shrink:0; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(186,255,41,.5);} 70%{box-shadow:0 0 0 10px rgba(186,255,41,0);} 100%{box-shadow:0 0 0 0 rgba(186,255,41,0);} }
  .handle{ font-size:38px; font-weight:800; letter-spacing:-0.03em; line-height:1.05; margin-bottom:6px; word-break:break-word; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:32px; }
  .section-title{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:28px 0 12px; }
  .options{ display:flex; flex-direction:column; gap:12px; }
  .opt{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; padding:18px 20px; text-decoration:none; color:var(--ink); cursor:pointer; transition:border-color .15s ease, transform .1s ease; }
  .opt:active{ transform:scale(0.98); }
  .opt:hover{ border-color:var(--accent); }
  .opt-left{ display:flex; align-items:center; gap:14px; }
  .icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--accent-dim); color:var(--accent); flex-shrink:0; }
  .opt-title{ font-weight:600; font-size:15px; }
  .opt-desc{ font-size:12px; color:var(--muted); margin-top:2px; }
  .chevron{ color:var(--muted); font-size:18px; }
  .pix-panel{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .pix-panel.open{ max-height:160px; margin-top:12px; }
  .pix-box{ background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .pix-label{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:8px;}
  .pix-key{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; word-break:break-all; color:var(--ink); margin-bottom:14px; line-height:1.5; }
  .copy-btn{ width:100%; background:var(--accent); color:#0b0d10; border:none; border-radius:10px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; }
  .copy-btn.copied{ background:#5c6b1f; color:var(--accent); }

  .products{ display:flex; flex-direction:column; gap:10px; }
  .product{ background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .product.sold{ opacity:.5; }
  .product-row{ display:flex; align-items:center; justify-content:space-between; }
  .product-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .pphoto{ width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .pphoto-empty{ background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; opacity:.4; }
  .pname{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .buy-btn{ background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0; }
  .buy-btn:active{ transform:scale(0.96); }
  .sold-badge{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#e07a7a; background:rgba(224,122,122,.12); border:1px solid rgba(224,122,122,.3); padding:4px 10px; border-radius:8px; flex-shrink:0; }
  .reveal{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .reveal.open{ max-height:460px; margin-top:12px; }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; }
  .qty-label{ font-size:12px; color:var(--muted); }
  .qty-control{ display:flex; align-items:center; gap:12px; }
  .qty-btn{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .qty-btn:active{ transform:scale(0.9); }
  .qty-value{ min-width:18px; text-align:center; font-weight:700; font-size:14px; }
  .reveal-price{ font-size:22px; font-weight:800; color:var(--accent); margin-bottom:14px; }
  .obs-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; display:block; }
  .obs-input{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px; font-size:13px; font-family:inherit; resize:vertical; min-height:56px; margin-bottom:4px; box-sizing:border-box; }
  .obs-count{ font-size:10px; color:var(--muted); text-align:right; margin-bottom:12px; }
  .order-actions{ display:flex; flex-direction:column; gap:8px; }
  .mini-btn{ display:block; width:100%; text-align:center; font-size:13px; font-weight:700; border-radius:8px; padding:11px 8px; border:none; text-decoration:none; cursor:pointer; box-sizing:border-box; }
  .ig-mini{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .wa-mini{ background:#25D366; color:#04150a; }

  footer{ margin-top:36px; text-align:center; font-size:11px; color:#4a5057; letter-spacing:.05em; }
</style>
</head>
<body>

<div class="card">
  <div class="top-row">
    <div class="tap"><span class="dot"></span> aproximação detectada</div>
    <a class="menu-dots" href="admin-f4rmacia.html" aria-label="admin">⋮</a>
  </div>
  <div class="handle" id="handleText">@f4rmacia.01</div>
  <div class="sub" id="subText">escolhe aí o que você veio ver</div>

  <div class="options">
    <a class="opt" id="igLink" href="https://instagram.com/f4rmacia.01" target="_blank" rel="noopener">
      <div class="opt-left">
        <div class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div><div class="opt-title">Instagram</div><div class="opt-desc">ver o perfil</div></div>
      </div>
      <div class="chevron">→</div>
    </a>

    <div class="opt" id="pixToggle">
      <div class="opt-left">
        <div class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 7l5-5 5 5M7 17l5 5 5-5M4 12h16"/>
          </svg>
        </div>
        <div><div class="opt-title">Pix</div><div class="opt-desc">chave aleatória</div></div>
      </div>
      <div class="chevron" id="pixChevron">↓</div>
    </div>

    <div class="pix-panel" id="pixPanel">
      <div class="pix-box">
        <div class="pix-label">chave pix (aleatória)</div>
        <div class="pix-key" id="pixKey"></div>
        <button class="copy-btn" id="copyBtn">copiar chave</button>
      </div>
    </div>
  </div>

  <div class="section-title">mostruário</div>
  <div class="products" id="products"><p style="color:var(--muted);font-size:13px;">carregando...</p></div>

  <footer>toque de novo pra abrir esta página</footer>
</div>

<script>
  // ===== NUVEM (JSONBin) =====
  const JSONBIN_READ_KEY = "$2a$10$gx7ihC5JhkDBS2UxUb02N.CEyLefJFe55nZEVsS8HtlGll4qGZPsW";
  const BIN_ID = "COLE_AQUI_O_ID_DO_BIN";

  let PIX_KEY = "";
  let IG_DM = "";
  let WHATSAPP_NUMBER = "5500000000000"; // fictício até você colocar o de verdade
  const products = [];

  function applyAccount(data){
    const handle = data.instagram || "seu_usuario_aqui";
    document.title = '@' + handle;
    document.getElementById('handleText').textContent = '@' + handle;
    document.getElementById('igLink').href = 'https://instagram.com/' + handle;
    IG_DM = 'https://ig.me/m/' + handle;
    PIX_KEY = data.pix || '';
    document.getElementById('pixKey').textContent = PIX_KEY;
    document.getElementById('subText').textContent = data.subtitle || 'escolhe aí o que você veio ver';
    document.documentElement.style.setProperty('--accent', data.theme || '#baff29');
    WHATSAPP_NUMBER = data.whatsapp || WHATSAPP_NUMBER;
  }

  async function loadCloudData(){
    try{
      const res = await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID + '/latest', {
        headers: { 'X-Access-Key': JSONBIN_READ_KEY }
      });
      if(!res.ok) throw new Error('resposta ' + res.status);
      const json = await res.json();
      const data = json.record || {};
      applyAccount(data);
      products.length = 0;
      (data.products || []).forEach(p => products.push(p));
    } catch(e){
      applyAccount({});
      document.getElementById('products').innerHTML =
        '<p style="color:var(--muted);font-size:13px;">não consegui carregar os dados agora. tenta atualizar a página.</p>';
      console.error(e);
      return;
    }
    renderProducts();
  }

  const toggle = document.getElementById('pixToggle');
  const panel = document.getElementById('pixPanel');
  const chevron = document.getElementById('pixChevron');
  toggle.addEventListener('click', () => {
    panel.classList.toggle('open');
    chevron.textContent = panel.classList.contains('open') ? '↑' : '↓';
  });

  const copyBtn = document.getElementById('copyBtn');
  async function copyToClipboard(text){
    try{ await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
  }
  copyBtn.addEventListener('click', async () => {
    await copyToClipboard(PIX_KEY);
    copyBtn.textContent = 'copiado ✓';
    copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = 'copiar chave'; copyBtn.classList.remove('copied'); }, 1800);
  });

  function money(v){ return "R$ " + v.toFixed(2).replace('.', ','); }

  const qty = {};

  function renderProducts(){
    const wrap = document.getElementById('products');
    wrap.innerHTML = products.map((p, i) => {
      qty[i] = Math.min(qty[i] || 1, Math.max(p.stock,1));
      const photoHtml = p.photo
        ? `<img src="${p.photo}" class="pphoto" alt="">`
        : `<div class="pphoto pphoto-empty">🖼️</div>`;
      if(p.stock <= 0){
        return `<div class="product sold">
          <div class="product-row">
            <div class="product-left">${photoHtml}<span class="pname">${p.name}</span></div>
            <span class="sold-badge">esgotado</span>
          </div>
        </div>`;
      }
      return `<div class="product">
        <div class="product-row">
          <div class="product-left">${photoHtml}<span class="pname">${p.name}</span></div>
          <button class="buy-btn" data-i="${i}">fazer pedido</button>
        </div>
        <div class="reveal" id="reveal-${i}">
          <div class="qty-row">
            <span class="qty-label">restam ${p.stock}</span>
            <div class="qty-control">
              <button class="qty-btn minus" data-i="${i}">−</button>
              <span class="qty-value" id="qty-${i}">${qty[i]}</span>
              <button class="qty-btn plus" data-i="${i}">+</button>
            </div>
          </div>
          <div class="reveal-price" id="total-${i}">${money(p.price * qty[i])}</div>
          <label class="obs-label">observação (opcional)</label>
          <textarea class="obs-input" id="obs-${i}" maxlength="500" placeholder="alguma observação sobre o pedido?" oninput="updateObsCount(${i})"></textarea>
          <div class="obs-count" id="obscount-${i}">0/500</div>
          <div class="order-actions">
            <button class="mini-btn ig-mini" data-i="${i}" onclick="confirmOrder(${i}, 'instagram')">pedir pelo instagram</button>
            <button class="mini-btn wa-mini" data-i="${i}" onclick="confirmOrder(${i}, 'whatsapp')">pedir pelo whatsapp</button>
          </div>
        </div>
      </div>`;
    }).join('');

    wrap.querySelectorAll('.buy-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> toggleProduct(btn.dataset.i));
    });
    wrap.querySelectorAll('.qty-btn.plus').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = btn.dataset.i;
        qty[i] = Math.min(products[i].stock, (qty[i]||1) + 1);
        updateQty(i);
      });
    });
    wrap.querySelectorAll('.qty-btn.minus').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = btn.dataset.i;
        qty[i] = Math.max(1, (qty[i]||1) - 1);
        updateQty(i);
      });
    });
  }

  function updateQty(i){
    document.getElementById('qty-'+i).textContent = qty[i];
    document.getElementById('total-'+i).textContent = money(products[i].price * qty[i]);
  }

  function updateObsCount(i){
    const el = document.getElementById('obs-'+i);
    document.getElementById('obscount-'+i).textContent = el.value.length + '/500';
  }

  function toggleProduct(i){
    document.getElementById('reveal-'+i).classList.toggle('open');
  }

  async function confirmOrder(i, channel){
    const p = products[i];
    const q = qty[i];
    const total = money(p.price * q);
    const obs = document.getElementById('obs-'+i).value.trim();
    const summary = 'Pedido:\nProduto: ' + p.name + '\nQuantidade: ' + q + '\nValor total: ' + total
      + '\nObservação: ' + (obs || '(nenhuma)');

    if(channel === 'instagram'){
      await copyToClipboard(summary);
      window.open(IG_DM, '_blank');
      alert('resumo do pedido copiado! cole na conversa que abriu no Instagram.');
    } else {
      const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(summary);
      window.open(url, '_blank');
    }
  }

  loadCloudData();
</script>

</body>
</html>
